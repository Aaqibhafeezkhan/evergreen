# Runs on the GitLab mirror of this repository, which hosts the CI/CD Catalog resource.
# See docs/GITLAB_CATALOG.md.
stages: [test, release]

# Dogfood the component at the commit being tested, against the pass fixture. Tag pipelines run it too, so a
# release is only published after the component works with the npm package it pins.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/evergreen@$CI_COMMIT_SHA
    inputs:
      path: tests/gitlab/fixtures/pass

# This repository is itself named evergreen-deprecation, so npx would resolve that package to the checkout
# (whose bin is not linked) instead of downloading it. Hide the manifest from npx for the dogfood job only.
evergreen:
  before_script:
    - mv package.json package.json.repo

# The Catalog requires plain semantic versions, while GitHub tags carry a "v" prefix.
release-version:
  stage: release
  image: alpine:3
  script:
    - echo "VERSION=${CI_COMMIT_TAG#v}" > version.env
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-version]
  script: echo "Publishing $VERSION to the CI/CD Catalog"
  release:
    tag_name: $VERSION
    ref: $CI_COMMIT_SHA
    description: "Evergreen GitLab component $VERSION. See CHANGELOG.md."
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
