apiVersion: v1
kind: List
items:
  - apiVersion: extensions/v1beta1
    kind: Ingress
    metadata:
      name: web
    spec:
      rules:
        - host: example.test
          http:
            paths:
              - path: /
                backend:
                  serviceName: web
                  servicePort: 80
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
            - name: web
              image: example/web:1.0.0
  - apiVersion: batch/v1beta1
    kind: CronJob
    metadata:
      name: cleanup
    spec:
      schedule: "0 3 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: cleanup
                  image: example/cleanup:1.0.0
