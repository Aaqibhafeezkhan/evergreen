# OpenAPI description of the static lifecycle API generated under docs/api/v1/.
# Served with the pages site at https://arminazimi.github.io/evergreen/api/openapi.yaml.
# Response shapes come from schemas/api-product.v1.schema.json ($defs index, product, recent, type, ruleDocument).

openapi: 3.1.0
info:
  title: Evergreen static lifecycle API
  description: |
    Read-only JSON documents generated from `registry/*.json`. The pages site
    serves `docs/`, so these paths are published under `/evergreen/api/`. Every
    document validates against
    [api-product.v1.schema.json](https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json).
  version: "1.0.0"
  license:
    name: MIT
    url: https://github.com/arminazimi/evergreen/blob/main/LICENSE

servers:
  - url: https://arminazimi.github.io/evergreen/api
    description: GitHub Pages (docs/)

paths:
  /v1/index.json:
    get:
      operationId: getIndex
      summary: Product index
      description: |
        Sorted list of every product identity in the registry, with a pointer to
        each product document, the PURL types, and `recent.json`.
      responses:
        "200":
          description: Index of products and aggregate counts.
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json#/$defs/index"

  /v1/products/{id}.json:
    get:
      operationId: getProduct
      summary: Product document
      description: |
        One product identity (PURL without version) and every registry rule that
        applies to it.
      parameters:
        - name: id
          in: path
          required: true
          description: File-name-safe product id (for example `npm-request`).
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: Product document with its lifecycle rules.
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json#/$defs/product"

  /v1/rules/{id}.json:
    get:
      operationId: getRule
      summary: Rule document
      description: |
        One registry rule, keyed by its rule id (for example
        `npm.package.request.deprecated`), with a pointer to its product document.
      parameters:
        - name: id
          in: path
          required: true
          description: Registry rule id.
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$"
      responses:
        "200":
          description: Rule document with its product link.
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json#/$defs/ruleDocument"

  /v1/types/{type}.json:
    get:
      operationId: getType
      summary: PURL type document
      description: |
        One PURL type (`npm`, `pypi`, …) and every product of that type, with a
        pointer to each product document.
      parameters:
        - name: type
          in: path
          required: true
          description: PURL type (for example `npm`).
          schema:
            type: string
            pattern: "^[a-z][a-z0-9.+-]*$"
      responses:
        "200":
          description: Products of one PURL type.
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json#/$defs/type"

  /v1/recent.json:
    get:
      operationId: getRecent
      summary: Recently reviewed rules
      description: |
        The rules with the newest review dates (at most 100), newest first.
      responses:
        "200":
          description: Recent-changes feed.
          content:
            application/json:
              schema:
                $ref: "https://raw.githubusercontent.com/arminazimi/evergreen/main/schemas/api-product.v1.schema.json#/$defs/recent"
