name: CI health

# Reacts to ci.yml. When a run on main fails it opens one `area: devops` issue, comments on that
# issue for each later failing run, and closes it with the recovering run once main is green again.
# It also measures how long ci.yml takes on completed runs, so the five-minute target stays visible:
# it writes metrics/ci/<date>.json and the step summary, and opens or updates one `area: devops`
# issue when the pull request p50 is over five minutes. Weekly it lists flaky tests seen in ci.yml
# logs, and publishes per-week CI health numbers — median and p90 duration, failure rate,
# cancellation rate, and reruns — from real runs to metrics/ci/health-<date>.json and the step
# summary. Nightly it runs tests listed in tests/quarantine.json. It needs the network, so it is
# deliberately not part of pull-request CI.

on:
  # zizmor: ignore[dangerous-triggers] -- it reads the triggering run's metadata only, never its code
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 6 * * 1" # Mondays, 06:47 UTC — duration + weekly flaky list
    - cron: "47 5 * * *" # Nightly, 05:47 UTC — quarantined tests
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options:
          - measure
          - quarantine
          - both
        default: both

permissions:
  contents: read

concurrency:
  group: ci-health-${{ github.event.schedule || github.event.inputs.job || 'dispatch' }}
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'measure' || github.event.inputs.job == 'both')
      || github.event.schedule == '47 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Measure CI duration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/tools/ci-duration.js --summary "$GITHUB_STEP_SUMMARY" --open-issue
      - name: List flaky tests from the past week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/run-tests.mjs --list-weekly-flaky
      - name: Publish weekly CI health numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node dist/tools/ci-health-report.js --summary "$GITHUB_STEP_SUMMARY" --weeks 8
      - name: Upload the metrics file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-duration
          path: metrics/ci
          if-no-files-found: warn

  quarantine:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'quarantine' || github.event.inputs.job == 'both')
      || github.event.schedule == '47 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Run quarantined tests
        # Quarantined files are skipped on pull requests; this nightly job is where they still run.
        env:
          EVERGREEN_RETRY_FLAKY: "0"
        run: node tools/run-tests.mjs --quarantine-only

  main-red:
    # workflow_run also fires for pull request runs; the branch filter above narrows the trigger and
    # this guard keeps the action to pushes to main, where a red run means the branch itself is red.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    # One reconciliation at a time, so concurrent runs cannot each see an empty issue list and open
    # a duplicate. A pending run that is superseded is dropped; the newest run still reconciles.
    concurrency:
      group: main-red-alert
      cancel-in-progress: false
    steps:
      # The default branch is checked out, not the triggering run's commit: the reconciler always
      # comes from reviewed code, and the failing run's code is never executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Open, update, or close the one main-red issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node dist/tools/main-red-alert.js
          --event "$GITHUB_EVENT_PATH"
          --summary "$GITHUB_STEP_SUMMARY"
