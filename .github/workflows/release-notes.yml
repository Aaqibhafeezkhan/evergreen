# Called after the binaries create a release; can also preview or explicitly replace its notes.
name: Release notes body

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      dry_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag whose changelog supplies the body (for example v1.4.2-rc.1)
        type: string
        required: true
      dry_run:
        description: Preview the body without editing a release
        type: boolean
        default: true
      force:
        description: Replace an existing non-placeholder body
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-notes-${{ inputs.release_tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use reviewed scripts from the default branch; only read the changelog at the tag.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Write the release body from its tagged changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: |
          if [ -z "$TAG" ]; then TAG="v$(node -p "require('./package.json').version")"; export TAG; fi
          bash .github/scripts/write-release-notes.sh
