apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: web
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  backend:
    serviceName: web
    servicePort: 80
  rules:
  - host: web.example.com
    http:
      paths:
      - path: /app
        backend:
          serviceName: app
          servicePort: http
