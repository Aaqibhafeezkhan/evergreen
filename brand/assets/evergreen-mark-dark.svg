<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen mark for dark surfaces</title>
  <desc id="desc">Three precise lifecycle rings with staggered notches and a migration node.</desc>
  <defs>
    <mask id="outer-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="119" y="18" width="18" height="28" fill="black"/>
    </mask>
    <mask id="middle-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="186" y="119" width="30" height="18" fill="black"/>
    </mask>
    <mask id="inner-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="119" y="160" width="18" height="30" fill="black"/>
    </mask>
  </defs>
  <g fill="none" stroke-width="18">
    <circle cx="128" cy="128" r="96" stroke="#571729" mask="url(#outer-notch)"/>
    <circle cx="128" cy="128" r="70" stroke="#8F3048" mask="url(#middle-notch)"/>
    <circle cx="128" cy="128" r="44" stroke="#B96779" mask="url(#inner-notch)"/>
  </g>
  <rect x="161" y="161" width="14" height="14" rx="2" fill="#F3ECE8"/>
</svg>
