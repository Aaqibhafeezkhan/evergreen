name: Release

# Orchestrates reusable release stages: verify → build → publish per channel → smoke.
# On a push to main it builds the Action bundle onto release/<tag>. After Publish to npm
# succeeds it runs the post-publish stages. A manual run with dry_run exercises every stage
# and publishes nothing. A manual run with release_tag dry-runs the major tag only (plus notes).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      from:
        description: Tag or commit to start from (default is the latest tag)
        required: false
      release_tag:
        description: Dry run of the major Action tag for this release tag (for example v1.4.2). Pushes nothing.
        required: false
        default: ""
      dry_run:
        description: Exercise every release stage without publishing
        type: boolean
        default: false
  # zizmor: ignore[dangerous-triggers] -- it runs only after the Publish workflow completes successfully
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/release-verify.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      from: ${{ inputs.from || '' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      run_notes: ${{ github.event_name == 'workflow_dispatch' }}
      run_reproducible: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}

  build-action:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/release-build-action.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    permissions:
      contents: write
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}

  build-binaries:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/release-build-binaries.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  publish-tags:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.dry_run))
    uses: ./.github/workflows/release-publish-tags.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    permissions:
      contents: write
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_tag: ${{ inputs.release_tag || '' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  publish-container:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/release-publish-container.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  publish-homebrew:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/release-publish-homebrew.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  publish-binaries:
    needs: build-binaries
    if: >-
      always() && needs.build-binaries.result == 'success' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    uses: ./.github/workflows/release-publish-binaries.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

  smoke:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    uses: ./.github/workflows/release-smoke.yml # zizmor: ignore[self-repository] -- it calls a stage of this same release pipeline
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      release_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
