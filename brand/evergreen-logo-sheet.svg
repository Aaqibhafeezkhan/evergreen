<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen logo system review sheet</title>
  <desc id="desc">Dark, light, and monochrome lockups plus small-size checks and the approved palette.</desc>
  <defs>
    <g id="mark-geometry" fill="none" stroke-width="18">
      <circle cx="128" cy="128" r="96" mask="url(#outer-notch)"/>
      <circle cx="128" cy="128" r="70" mask="url(#middle-notch)"/>
      <circle cx="128" cy="128" r="44" mask="url(#inner-notch)"/>
    </g>
    <mask id="outer-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="119" y="18" width="18" height="28" fill="black"/>
    </mask>
    <mask id="middle-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="186" y="119" width="30" height="18" fill="black"/>
    </mask>
    <mask id="inner-notch">
      <rect width="256" height="256" fill="white"/>
      <rect x="119" y="160" width="18" height="30" fill="black"/>
    </mask>
    <g id="brand-mark">
      <circle cx="128" cy="128" r="96" fill="none" stroke="#571729" stroke-width="18" mask="url(#outer-notch)"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#8F3048" stroke-width="18" mask="url(#middle-notch)"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="#B96779" stroke-width="18" mask="url(#inner-notch)"/>
      <rect x="161" y="161" width="14" height="14" rx="2" fill="#F3ECE8"/>
    </g>
    <g id="light-mark">
      <circle cx="128" cy="128" r="96" fill="none" stroke="#0A0A0C" stroke-width="18" mask="url(#outer-notch)"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#571729" stroke-width="18" mask="url(#middle-notch)"/>
      <circle cx="128" cy="128" r="44" fill="none" stroke="#B96779" stroke-width="18" mask="url(#inner-notch)"/>
      <rect x="161" y="161" width="14" height="14" rx="2" fill="#365C4C"/>
    </g>
    <g id="mono-mark">
      <g fill="none" stroke="#F3ECE8" stroke-width="18">
        <circle cx="128" cy="128" r="96" mask="url(#outer-notch)"/>
        <circle cx="128" cy="128" r="70" mask="url(#middle-notch)"/>
        <circle cx="128" cy="128" r="44" mask="url(#inner-notch)"/>
      </g>
      <rect x="161" y="161" width="14" height="14" rx="2" fill="#F3ECE8"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#111113"/>
  <rect x="40" y="40" width="740" height="510" rx="24" fill="#0A0A0C"/>
  <rect x="820" y="40" width="740" height="510" rx="24" fill="#F3ECE8"/>
  <rect x="40" y="590" width="1520" height="270" rx="24" fill="#19181A"/>

  <g transform="translate(92 150) scale(.95)"><use href="#brand-mark"/></g>
  <text x="355" y="290" fill="#F3ECE8" font-family="Inter Variable, Inter, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="5">EVERGREEN</text>
  <text x="357" y="326" fill="#BDB7B4" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1.5">KNOW WHAT BREAKS NEXT.</text>

  <g transform="translate(872 150) scale(.95)"><use href="#light-mark"/></g>
  <text x="1135" y="290" fill="#0A0A0C" font-family="Inter Variable, Inter, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="5">EVERGREEN</text>
  <text x="1137" y="326" fill="#571729" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="1.5">KNOW WHAT BREAKS NEXT.</text>

  <g transform="translate(100 625) scale(.72)"><use href="#mono-mark"/></g>
  <g transform="translate(335 677) scale(.32)"><use href="#brand-mark"/></g>
  <g transform="translate(455 709) scale(.16)"><use href="#brand-mark"/></g>
  <text x="340" y="815" fill="#BDB7B4" font-family="ui-monospace, monospace" font-size="14">64px</text>
  <text x="468" y="815" fill="#BDB7B4" font-family="ui-monospace, monospace" font-size="14">32px</text>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#BDB7B4">
    <circle cx="760" cy="710" r="34" fill="#0A0A0C" stroke="#3A393C"/>
    <text x="720" y="775">#0A0A0C</text>
    <circle cx="910" cy="710" r="34" fill="#571729"/>
    <text x="870" y="775">#571729</text>
    <circle cx="1060" cy="710" r="34" fill="#8F3048"/>
    <text x="1020" y="775">#8F3048</text>
    <circle cx="1210" cy="710" r="34" fill="#B96779"/>
    <text x="1170" y="775">#B96779</text>
    <circle cx="1360" cy="710" r="34" fill="#F3ECE8"/>
    <text x="1320" y="775">#F3ECE8</text>
  </g>
</svg>
