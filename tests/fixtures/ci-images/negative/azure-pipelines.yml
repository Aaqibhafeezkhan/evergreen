# vmImage: ubuntu-16.04
name: pool-name-without-vmImage
pool:
  name: self-hosted
variables:
  runner: $(vmImage)
  image: ${{ variables.image }}
  image2: ${IMAGE}
jobs:
  - job: Dynamic
    pool:
      vmImage: $(vmImage)
    steps:
      - script: echo ubuntu-18.04
      - displayName: windows-2019
      - resource_class: macos.medium
  - job: Template
    pool:
      vmImage: ${{ variables.image }}
  - job: FloatingUbuntu
    pool:
      vmImage: ubuntu-latest
  - job: FloatingWindows
    pool:
      vmImage: windows-latest
