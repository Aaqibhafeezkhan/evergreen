name: Install slsa-verifier

# One pinned slsa-verifier for every release job that checks provenance. The binary is downloaded
# from the official release and checked against the SHA-256 recorded in that release's signed
# provenance, so a changed or truncated download fails here instead of producing a false pass.
description: Install the pinned slsa-verifier on the runner's PATH.

runs:
  using: composite
  steps:
    - name: Download and verify slsa-verifier
      shell: bash
      env:
        SLSA_VERIFIER_VERSION: v2.7.1
        SLSA_VERIFIER_SHA256: 946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/slsa-verifier-bin"
        mkdir -p "$bin"
        curl -fsSL --retry 3 -o "$bin/slsa-verifier" \
          "https://github.com/slsa-framework/slsa-verifier/releases/download/${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64"
        echo "${SLSA_VERIFIER_SHA256}  $bin/slsa-verifier" | sha256sum --check -
        sudo install -m 0755 "$bin/slsa-verifier" /usr/local/bin/slsa-verifier
