apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: web # the edge
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  backend:
    serviceName: default-svc
    servicePort: 8080
  tls:
    - secretName: web-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            backend:
              serviceName: shop
              servicePort: http
          - path: /api
            pathType: Prefix
            backend:
              serviceName: shop-api # the api service
              servicePort: 9000 # the api port
    - http:
        paths:
          - backend:
              serviceName: catchall
              servicePort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  ports:
    - port: 80
      targetPort: http
