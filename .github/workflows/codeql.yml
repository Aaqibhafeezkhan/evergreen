name: CodeQL

# Static analysis on every commit: pull requests and pushes to `main`.
# Results go to the same code-scanning dashboard as the Scorecard and Evergreen
# SARIF uploads. Pinned to full commit SHAs; see SECURITY.md for token scopes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Checkout the repository.
      contents: read
      # Read workflow metadata when a pull request comes from a fork.
      actions: read
      # Upload results to the code-scanning dashboard.
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          # The package is TypeScript with JavaScript sources for the Action bundle;
          # every other language in the tree is test fixture data.
          languages: javascript-typescript
          # JavaScript and TypeScript need no build for extraction.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
