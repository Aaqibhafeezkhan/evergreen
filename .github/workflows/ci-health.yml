name: CI health

# Measures how long ci.yml takes on completed runs, so the five-minute target stays visible. Writes
# metrics/ci/<date>.json and the step summary, and opens or updates one `area: devops` issue when
# the pull request p50 is over five minutes. It needs the network, so it is deliberately not part of
# pull-request CI.

on:
  schedule:
    - cron: "47 6 * * 1" # Mondays, 06:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Measure CI duration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/tools/ci-duration.js --summary "$GITHUB_STEP_SUMMARY" --open-issue
      - name: Upload the metrics file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-duration
          path: metrics/ci
          if-no-files-found: warn
