name: Release notes

# Drafts the changelog entries for a release from conventional commits. It only reads the repository and
# publishes nothing: a maintainer copies the notes into CHANGELOG.md (or runs the tool with --write) and
# follows docs/RELEASING.md for the rest.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Tag or commit to start from (default is the latest tag)
        required: false
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]

permissions:
  contents: read

jobs:
  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Draft the release notes
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            node dist/tools/changelog.js --from "$FROM" > release-notes.md
          else
            node dist/tools/changelog.js > release-notes.md
          fi
          { echo "## Draft release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes.md

  major-tag:
    # The publish workflow includes the package smoke test, so a successful completion means every
    # release gate has passed. Pre-releases and pre-1.0 releases intentionally leave major tags alone.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: action-major-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Select the stable release tag
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          release_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" =~ ^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$ ]]; then
              if [ -n "$release_tag" ]; then
                echo "More than one stable release tag points at $RELEASE_SHA." >&2
                exit 1
              fi
              release_tag="$candidate"
            fi
          done < <(git tag --points-at "$RELEASE_SHA")

          if [ -z "$release_tag" ]; then
            echo "No stable post-1.0 release tag points at $RELEASE_SHA; leaving major tags unchanged."
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected="v$(node -p "require('./package.json').version")"
          if [ "$release_tag" != "$expected" ]; then
            echo "Release tag $release_tag does not match package.json version $expected." >&2
            exit 1
          fi

          echo "move=true" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "major-tag=${release_tag%%.*}" >> "$GITHUB_OUTPUT"
      - name: Move the major Action tag
        if: steps.release.outputs.move == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
        shell: bash
        run: |
          old_target="$(git ls-remote --refs origin "refs/tags/$MAJOR_TAG" | cut -f1)"
          if [ -n "$old_target" ]; then
            current_release="$(git tag --points-at "$old_target" | grep -E "^${MAJOR_TAG}\\.[0-9]+\\.[0-9]+$" | sort -V | tail -n 1 || true)"
            newest="$(printf '%s\n' "$current_release" "$RELEASE_TAG" | sort -V | tail -n 1)"
            if [ -n "$current_release" ] && [ "$newest" != "$RELEASE_TAG" ]; then
              echo "Refusing to move $MAJOR_TAG backward from $current_release to $RELEASE_TAG." >&2
              exit 1
            fi
          fi
          git tag --force "$MAJOR_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force-with-lease="refs/tags/$MAJOR_TAG:$old_target"
          echo "$MAJOR_TAG now points to $RELEASE_TAG ($RELEASE_SHA)." >> "$GITHUB_STEP_SUMMARY"
