name: matrix-node
on: push
jobs:
  block-list:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 14
          - 24
          - 20
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
  flow-list:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [14, 24]
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
