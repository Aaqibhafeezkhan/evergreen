name: matrix-node
on: push
jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      # Node 14 was dropped; the old pin was actions/setup-node@v2.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
        # node-version: 14 and 16 are gone
  floating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: latest
  unresolved-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(needs.plan.outputs.node-matrix) }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
