name: Workflow lint

# Catches broken expressions, script injection, and over-broad permissions in the workflow files before
# they merge. actionlint parses `.github/workflows`; zizmor audits those workflows and action.yml for
# security issues. Both tools are pinned to exact releases and verified against a recorded checksum.
on:
  pull_request:
    types: [labeled]
    paths:
      - ".github/**"
      - "action.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ready-to-merge'
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Install zizmor
        env:
          ZIZMOR_VERSION: "1.31.1"
          ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      - name: Lint the workflows with actionlint
        run: '"${RUNNER_TEMP}/actionlint"'
      - name: Audit the workflows and the Action with zizmor
        run: '"${RUNNER_TEMP}/zizmor" --persona=regular .github action.yml'
