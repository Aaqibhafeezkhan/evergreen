name: Source freshness

# Checks that the evidence behind every lifecycle rule is still reachable and has not moved, and that
# rules are reviewed inside their freshness window. It reads rules and never edits them; a maintainer
# reviews anything it reports. It needs the network, so it is deliberately not part of pull-request CI.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Check rule sources
        run: node dist/tools/check-sources.js --out source-report.json --summary "$GITHUB_STEP_SUMMARY" --fail-on stale,changed,unreachable
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-report
          path: source-report.json
          if-no-files-found: warn
