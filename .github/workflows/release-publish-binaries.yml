# Release stage: attach signed binaries and SLSA provenance to the GitHub release.
# A dry run writes checksums from the build artifacts and uploads nothing.
name: Release publish binaries

on:
  workflow_call:
    inputs:
      dry_run:
        description: Checksum and verify locally; do not upload release assets
        type: boolean
        required: true
      release_sha:
        description: Commit to check out for a post-publish run; empty uses the default branch
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  binary-release:
    # Attaches binaries with SHA256SUMS, keyless Sigstore signatures, and build provenance.
    # Hashes go to the SLSA generator job, which attaches .intoto.jsonl provenance.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Called from release.yml on a version tag, so the OIDC identity is this file @ refs/tags/vX.Y.Z.
    env:
      IDENTITY_PATTERN: ^https://github\.com/arminazimi/evergreen/\.github/workflows/release-publish-binaries\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      hashes: ${{ steps.release.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Default branch first: ref: workflow_run.head_sha is a Dangerous-Workflow untrusted checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release commit
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: git checkout --detach "$RELEASE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - name: Select release and write checksums
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$RELEASE_SHA" ]; then
            git tag --points-at HEAD | grep -Fx "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          cd binaries
          chmod +x evergreen-*
          sha256sum evergreen-* > SHA256SUMS
          echo "hashes=$(sha256sum evergreen-* | base64 -w0)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.dry_run }}
        with:
          subject-path: binaries/evergreen-*
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.dry_run }}
      - name: Sign binaries and checksums (keyless)
        if: ${{ !inputs.dry_run }}
        working-directory: binaries
        run: |
          for file in evergreen-* SHA256SUMS; do
            case "${file}" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - name: Verify what was just signed
        if: ${{ !inputs.dry_run }}
        working-directory: binaries
        run: |
          for file in evergreen-* SHA256SUMS; do
            case "${file}" in *.sigstore.json) continue ;; esac
            cosign verify-blob \
              --bundle "${file}.sigstore.json" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              --certificate-identity-regexp "${IDENTITY_PATTERN}" \
              "${file}"
          done
      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Standalone binaries for $TAG. Release notes follow." $prerelease
          fi
          # evergreen-* already matches each binary's .sigstore.json; listing them again in a second
          # glob makes gh upload both copies in parallel and the second one fails with HTTP 422.
          gh release upload "$TAG" binaries/evergreen-* binaries/SHA256SUMS binaries/SHA256SUMS.sigstore.json --clobber
      - name: Record dry-run stage
        if: inputs.dry_run
        run: echo "Publish stage (binaries) dry run wrote checksums; nothing was attached to a release." >> "$GITHUB_STEP_SUMMARY"

  # SLSA Build L3 provenance. Must be referenced by a vX.Y.Z tag (not a commit SHA).
  # upload-tag-name is set explicitly so a dry-run or detached checkout still names the right tag.
  provenance:
    needs: binary-release
    if: ${{ !inputs.dry_run }}
    permissions:
      actions: read
      id-token: write
      contents: write
    # zizmor: ignore[unpinned-uses] -- the generator identifies itself by this vX.Y.Z tag, not by a commit SHA
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.binary-release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.binary-release.outputs.tag }}
      provenance-name: multiple.intoto.jsonl

  # The release fails if the provenance is missing or does not match the published assets.
  verify:
    needs: [binary-release, provenance]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/slsa-verifier
      - name: Download the release assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.binary-release.outputs.tag }}
        run: |
          mkdir -p release
          gh release download "$TAG" --pattern 'multiple.intoto.jsonl' --dir release
          gh release download "$TAG" --pattern 'evergreen-*' --dir release
          find release -name '*.sigstore.json' -delete
      - name: Verify the binary provenance
        env:
          TAG: ${{ needs.binary-release.outputs.tag }}
        run: |
          slsa-verifier verify-artifact release/evergreen-* \
            --provenance-path release/multiple.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "$TAG" \
            --builder-id "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
