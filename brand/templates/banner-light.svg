<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen light banner</title>
  <desc id="desc">Evergreen wordmark and tagline with the Version Notches mark on a restrained warm light grid.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0A0A0C" stroke-opacity=".035"/></pattern>
    <mask id="outer-notch"><rect width="256" height="256" fill="white"/><rect x="119" y="18" width="18" height="28" fill="black"/></mask>
    <mask id="middle-notch"><rect width="256" height="256" fill="white"/><rect x="186" y="119" width="30" height="18" fill="black"/></mask>
    <mask id="inner-notch"><rect width="256" height="256" fill="white"/><rect x="119" y="160" width="18" height="30" fill="black"/></mask>
  </defs>
  <rect width="1500" height="500" fill="#F3ECE8"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <path d="M1130 0A370 370 0 0 0 1500 370M1202 0A298 298 0 0 0 1500 298M1274 0A226 226 0 0 0 1500 226" fill="none" stroke="#571729" stroke-opacity=".14" stroke-width="2"/>
  <g transform="translate(96 122)" fill="none" stroke-width="18">
    <circle cx="128" cy="128" r="96" stroke="#0A0A0C" mask="url(#outer-notch)"/>
    <circle cx="128" cy="128" r="70" stroke="#571729" mask="url(#middle-notch)"/>
    <circle cx="128" cy="128" r="44" stroke="#B96779" mask="url(#inner-notch)"/>
    <rect x="161" y="161" width="14" height="14" rx="2" fill="#365C4C" stroke="none"/>
  </g>
  <text x="420" y="226" fill="#0A0A0C" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="8">EVERGREEN</text>
  <text x="424" y="282" fill="#8F3048" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="500">Know what breaks next.</text>
  <text x="424" y="338" fill="#0A0A0C" fill-opacity=".58" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="1.5">LOCAL-FIRST / EVIDENCE-BACKED / AGENT-READY</text>
</svg>

