name: Release

# Drafts the changelog entries for a release from conventional commits. It only reads the repository and
# the notes job publishes nothing: a maintainer copies them into CHANGELOG.md (or runs the tool with --write) and
# follows docs/RELEASING.md for the rest. After a successful npm publish it also builds the standalone binaries
# (no Node.js needed) and attaches them to the GitHub release with checksums, a GitHub build-provenance
# attestation, and an SLSA .intoto.jsonl provenance file from the SLSA GitHub generator. It also smoke-tests the
# README quickstart against the published package on Linux, macOS, and Windows (tests/quickstart.md is the
# recorded expectation).
on:
  workflow_dispatch:
    inputs:
      from:
        description: Tag or commit to start from (default is the latest tag)
        required: false
      release_tag:
        description: Dry run of the major Action tag for this release tag (for example v1.4.2). Pushes nothing.
        required: false
        default: ""
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]

permissions:
  contents: read

jobs:
  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Draft the release notes
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            node dist/tools/changelog.js --from "$FROM" > release-notes.md
          else
            node dist/tools/changelog.js > release-notes.md
          fi
          { echo "## Draft release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes.md

  major-tag:
    # The publish workflow includes the package smoke test, so a successful completion means every
    # release gate has passed. Pre-releases and pre-1.0 releases intentionally leave major tags alone.
    # A manual run with `release_tag` is a dry run: it makes every decision and pushes nothing.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: action-major-tag
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      # The default branch is checked out, not the release commit: the decision script then always comes from
      # reviewed code on the default branch, even for a release (or a dry-run tag) that predates the script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select the stable release tag
        id: release
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          # The decision lives in .github/scripts/major-tag.mjs, which has unit tests (tests/major-tag.test.ts).
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            release_sha="$EVENT_SHA"
          else
            release_sha="$(git rev-list -n 1 "refs/tags/$DISPATCH_TAG")"
          fi
          tags="$(git tag --points-at "$release_sha")"
          version="$(git show "$release_sha:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          node .github/scripts/major-tag.mjs select --tags "$tags" --package-version "$version" >> "$GITHUB_OUTPUT"
      - name: Check the major tag only moves forward
        id: direction
        if: steps.release.outputs.move == 'true'
        env:
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        shell: bash
        run: |
          old_target="$(git ls-remote --refs origin "refs/tags/$MAJOR_TAG" | cut -f1)"
          current_tags=""
          if [ -n "$old_target" ]; then current_tags="$(git tag --points-at "$old_target")"; fi
          echo "old-target=$old_target" >> "$GITHUB_OUTPUT"
          node .github/scripts/major-tag.mjs direction --major "$MAJOR_TAG" --release "$RELEASE_TAG" --current-tags "$current_tags" >> "$GITHUB_OUTPUT"
      - name: Say what would happen (dry run)
        if: env.DRY_RUN == 'true'
        env:
          MOVE: ${{ steps.release.outputs.move }}
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          OLD_TARGET: ${{ steps.direction.outputs.old-target }}
        shell: bash
        run: |
          if [ "$MOVE" = "true" ]; then
            echo "Dry run: $MAJOR_TAG would move from ${OLD_TARGET:-nothing (new tag)} to $RELEASE_TAG ($RELEASE_SHA). Nothing was pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: no major tag would move. Nothing was pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Move the major Action tag
        if: env.DRY_RUN != 'true' && steps.release.outputs.move == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          OLD_TARGET: ${{ steps.direction.outputs.old-target }}
        shell: bash
        run: |
          git tag --force "$MAJOR_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force-with-lease="refs/tags/$MAJOR_TAG:$OLD_TARGET"
          echo "$MAJOR_TAG now points to $RELEASE_TAG ($RELEASE_SHA)." >> "$GITHUB_STEP_SUMMARY"

  published-scan:
    # The publish workflow smoke-tests the package on a small fixture. This job scans this repository with the
    # published package and with the build that passed CI, and fails the release workflow if the summaries differ.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Select release
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          git tag --points-at HEAD | grep -Fx "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build --silent
      - name: Scan with the build that passed CI
        run: node dist/src/cli.js scan . --json > "$RUNNER_TEMP/built.json"
      - name: Scan with the published package
        # Run from a temporary directory: inside the checkout, npx would resolve this repository's own bin.
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npx --yes "evergreen-deprecation@$VERSION" scan "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/published.json"
      - name: Compare the summaries
        run: node .github/scripts/release-smoke.mjs "$RUNNER_TEMP/built.json" "$RUNNER_TEMP/published.json"

  quickstart:
    # The README quickstart must work from what users install, not from a local build. This job runs the commands of
    # tests/quickstart.md with the published package on the three release platforms and fails when any output differs
    # from the expectations recorded there, so a broken quickstart fails the release.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    name: quickstart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Select release
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          git tag --points-at HEAD | grep -Fx "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run the README quickstart with the published package
        # Run from a temporary directory: inside the checkout, npx would resolve this repository's own bin.
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # One clean project per runner: the quickstart sees the smoke fixture, not this repository's checkout.
          dir="$RUNNER_TEMP/quickstart"
          mkdir "$dir"
          cp "$GITHUB_WORKSPACE/tests/fixtures/smoke/package.json" "$dir/package.json"
          cd "$dir"

          # The same package smoke the publish workflow runs, this time on Linux, macOS, and Windows runners.
          node "$GITHUB_WORKSPACE/.github/scripts/smoke.mjs" "$GITHUB_WORKSPACE/tests/fixtures/smoke" -- npx --yes "evergreen-deprecation@$VERSION"

          # The quickstart commands of tests/quickstart.md, against the published package.
          node - "$VERSION" <<'NODE'
          const { spawnSync } = require("node:child_process");
          const { existsSync } = require("node:fs");

          const version = process.argv[2];
          const windows = process.platform === "win32";
          const run = (args) => {
            const result = spawnSync("npx", ["--yes", `evergreen-deprecation@${version}`, ...args], {
              encoding: "utf8",
              maxBuffer: 20 * 1024 * 1024,
              shell: windows,
            });
            if (result.error) throw new Error(`${args.join(" ")} could not run: ${result.error.message}`);
            return result;
          };
          const fail = (message) => {
            console.error(`FAIL: ${message}`);
            process.exit(1);
          };
          const expect = (condition, message) => {
            if (!condition) fail(message);
            console.log(`ok: ${message}`);
          };
          const jsonOf = (result, args, statusExpected) => {
            expect(result.status === statusExpected, `${args.join(" ")} exits ${statusExpected} (got ${result.status})`);
            let parsed;
            try {
              parsed = JSON.parse(result.stdout);
            } catch {
              fail(`${args.join(" ")} prints JSON`);
            }
            return parsed;
          };
          const parseJson = (schema, value, what) => {
            expect(value?.schemaVersion === schema, `${what} reports ${schema} (got ${value?.schemaVersion})`);
            return value;
          };

          const id = "npm.package.request.deprecated:package.json:5";

          const scan = jsonOf(run(["scan", ".", "--json"]), ["scan", ".", "--json"], 0);
          parseJson("evergreen.scan.v1", scan, "the JSON scan");
          const ruleIds = new Set((scan.findings ?? []).map((finding) => finding.ruleId));
          expect(ruleIds.has("npm.package.request.deprecated"), "the scan finds the deprecated package");
          expect([...ruleIds].some((ruleId) => ruleId.startsWith("nodejs.runtime.")), "the scan finds the end-of-life Node.js range");
          expect(scan.unclassified?.count === 0, "the smoke fixture has nothing unclassified");

          const compact = run(["scan", ".", "--format", "compact"]);
          expect(compact.status === 0, `scan --format compact exits 0 (got ${compact.status})`);
          const lines = compact.stdout.trimEnd().split(/\r?\n/);
          const count = /^Evergreen: (\d+) findings?$/.exec(lines[0]);
          expect(count !== null && Number(count[1]) > 0, `the compact header counts the findings (got ${lines[0]})`);
          expect(Buffer.byteLength(compact.stdout, "utf8") <= 8192, "the compact report stays under the documented 8 KiB cap");
          expect(lines.some((line) => line.startsWith("npm.package.request.deprecated:package.json:5 package.json:5 high ")),
            "the compact report lists the deprecated package first");
          for (const line of lines.slice(1)) {
            if (/^\d+ more findings? omitted\b/.test(line)) continue;
            const columns = line.split(" ");
            expect(/^\S+:\S+:\d+$/.test(columns[0]) && /^\S+:\d+$/.test(columns[1]) && ["high", "medium", "low", "info"].includes(columns[2]) && columns.length >= 4,
              `the compact line has the documented id, location, severity, and replacement columns (got ${line})`);
          }

          const doctor = run(["doctor", "."]);
          expect(doctor.status === 0, `doctor exits 0 (got ${doctor.status})`);
          expect(doctor.stdout.includes("Status: ready-with-warnings"), "doctor reports ready-with-warnings");
          expect(doctor.stdout.includes("Privacy: no repository data was uploaded and no configuration was changed."),
            "doctor closes with the privacy promise");

          const doctorJson = jsonOf(run(["doctor", ".", "--json"]), ["doctor", ".", "--json"], 0);
          parseJson("evergreen.doctor.v1", doctorJson, "the JSON doctor");
          expect(doctorJson.summary?.failed === 0, "doctor reports no failed check");
          expect(doctorJson.summary?.status === "ready-with-warnings", "the JSON doctor reports ready-with-warnings");

          const capabilities = jsonOf(run(["capabilities", "--json"]), ["capabilities", "--json"], 0);
          parseJson("evergreen.capabilities.v1", capabilities, "the manifest");
          expect(Array.isArray(capabilities.ecosystems) && capabilities.ecosystems.some((ecosystem) => ecosystem.id === "npm"),
            "the manifest ships the npm ecosystem");

          const checkPurl = "pkg:npm/request@2.88.2";
          const check = run(["check", checkPurl]);
          expect(check.status === 1, `check exits 1 for a high-severity affected rule (got ${check.status})`);
          expect(check.stdout.includes("Status: affected (high)"), "check reports Status: affected (high)");
          expect(check.stdout.includes("https://www.npmjs.com/package/request"), "check names the evidence source");

          const checkJson = jsonOf(run(["check", checkPurl, "--json"]), ["check", checkPurl, "--json"], 1);
          parseJson("evergreen.check.v1", checkJson, "the JSON check");
          expect(checkJson.status === "affected" && (checkJson.findings ?? []).some((finding) => finding.severity === "high"),
            "the JSON check reports an affected high finding");

          const dataStatus = run(["data", "status"]);
          expect(dataStatus.status === 0 && dataStatus.stdout.includes("Source: bundled"), "the quickstart works on bundled data");

          const explain = run(["explain", id, "."]);
          expect(explain.status === 0 && explain.stdout.includes("Rule: npm.package.request.deprecated") && explain.stdout.includes("Location: package.json:5") && explain.stdout.includes("Sources:"),
            `explain ${id} prints rule, location, and sources`);

          const context = jsonOf(run(["context", id, ".", "--json"]), ["context", id, ".", "--json"], 0);
          parseJson("evergreen.context.v1", context, "the migration context");

          const baseline = run(["baseline", "."]);
          expect(baseline.status === 0 && baseline.stdout.includes("Wrote"), `baseline exits 0 and writes (exit ${baseline.status})`);
          expect(existsSync(".evergreen-baseline.json"), "baseline leaves .evergreen-baseline.json in the project");

          const accepted = jsonOf(run(["scan", ".", "--baseline", ".evergreen-baseline.json", "--json"]), ["scan", ".", "--baseline", ".evergreen-baseline.json", "--json"], 0);
          parseJson("evergreen.scan.v1", accepted, "the baseline scan");
          expect((accepted.findings ?? []).length === 0, "the baseline accepts every fixture finding");

          console.log("Quickstart smoke test passed.");
          NODE

  container:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: container-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Select release
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          git tag --points-at HEAD | grep -Fx "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${{ github.repository }}:$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "tags=ghcr.io/${{ github.repository }}:$version,ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke test
        run: |
          docker build -t evergreen-smoke .
          node .github/scripts/smoke.mjs /workspace -- docker run --rm --network none --read-only -v "$PWD/tests/fixtures/smoke:/workspace:ro" evergreen-smoke
      - name: Publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.release.outputs.tags }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@$DIGEST"

  binary:
    # Standalone binaries: Node.js single executable applications that embed the packed package, so people who
    # only want to scan need no Node.js. Built by .github/scripts/build-sea.mjs, one per platform.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, exe: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: "" }
          - { os: macos-15-intel, target: darwin-x64, exe: "" }
          - { os: macos-latest, target: darwin-arm64, exe: "" }
          - { os: windows-latest, target: win32-x64, exe: ".exe" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # `node --build-sea` needs 25.5 or newer; the binary carries this runtime.
          node-version: 26
          cache: npm
      - name: Select release
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          git tag --points-at HEAD | grep -Fx "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=evergreen-$version-${{ matrix.target }}${{ matrix.exe }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build --silent
      - name: Build the binary
        shell: bash
        run: |
          mkdir binaries
          node .github/scripts/build-sea.mjs "binaries/${{ steps.release.outputs.file }}"
      - name: Sign ad hoc (macOS refuses to run an unsigned executable)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "binaries/${{ steps.release.outputs.file }}"
      - name: Smoke test without Node.js on the path
        if: runner.os != 'Windows'
        run: |
          node .github/scripts/smoke.mjs tests/fixtures/smoke -- env PATH=/usr/bin:/bin "$PWD/binaries/${{ steps.release.outputs.file }}"
      - name: Smoke test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node .github/scripts/smoke.mjs tests/fixtures/smoke -- "$PWD/binaries/${{ steps.release.outputs.file }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.target }}
          path: binaries/${{ steps.release.outputs.file }}
          if-no-files-found: error

  binary-release:
    # Attaches the binaries to the GitHub release for the tag, with a SHA256SUMS file and a build provenance
    # attestation for each binary (verify with `gh attestation verify <file> --repo arminazimi/evergreen`).
    # Hashes are also passed to the SLSA generator job below, which attaches an .intoto.jsonl provenance
    # file to the same release (verify with slsa-verifier).
    needs: binary
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      hashes: ${{ steps.release.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - name: Select release and write checksums
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          git tag --points-at HEAD | grep -Fx "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          cd binaries
          chmod +x evergreen-*
          sha256sum evergreen-* > SHA256SUMS
          # Subjects for the SLSA generator: same digests as SHA256SUMS, base64-encoded on one line.
          echo "hashes=$(sha256sum evergreen-* | base64 -w0)" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: binaries/evergreen-*
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The release body is written by a maintainer (docs/RELEASING.md); create a placeholder only if it is missing.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Standalone binaries for $TAG. Release notes follow." $prerelease
          fi
          gh release upload "$TAG" binaries/evergreen-* binaries/SHA256SUMS --clobber

  # SLSA Build L3 provenance for the release binaries. Must be referenced by a vX.Y.Z tag (not a
  # commit SHA): that is how the generator identifies itself. upload-tag-name is required because
  # this workflow is triggered by workflow_run, not by pushing the version tag.
  provenance:
    needs: binary-release
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.binary-release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.binary-release.outputs.tag }}
      provenance-name: multiple.intoto.jsonl
