# Release stage: generate the CycloneDX SBOM from the production dependency tree, validate it against
# the CycloneDX 1.5 schema, sign it keylessly, and attach it to the GitHub release.
# A dry run generates and validates it and attaches nothing.
name: Release SBOM

on:
  workflow_call:
    inputs:
      dry_run:
        description: Generate and validate only; do not attach to a GitHub release
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    # Called from release.yml on a version tag, so the OIDC identity is this file @ refs/tags/vX.Y.Z.
    env:
      IDENTITY_PATTERN: ^https://github\.com/arminazimi/evergreen/\.github/workflows/release-sbom\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - name: Generate the SBOM from what the package installs
        run: |
          npm ls --omit=dev --all --json > npm-tree.json
          node .github/scripts/release-sbom.mjs generate --tree npm-tree.json --output sbom.cdx.json
      - name: Validate the SBOM against the CycloneDX schema and the release tree
        run: node .github/scripts/release-sbom.mjs check sbom.cdx.json --tree npm-tree.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.dry_run }}
      - name: Sign and verify the SBOM (keyless)
        if: ${{ !inputs.dry_run }}
        run: |
          cosign sign-blob --yes --bundle sbom.cdx.json.sigstore.json sbom.cdx.json
          cosign verify-blob \
            --bundle sbom.cdx.json.sigstore.json \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            --certificate-identity-regexp "${IDENTITY_PATTERN}" \
            sbom.cdx.json
      - name: Attach to the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            prerelease=""
            case "$tag" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$tag" --verify-tag --title "$tag" --notes "SBOM for $tag. Release notes follow." $prerelease
          fi
          gh release upload "$tag" sbom.cdx.json sbom.cdx.json.sigstore.json --clobber
      - name: Record dry-run stage
        if: inputs.dry_run
        run: echo "Publish stage (SBOM) generated and validated sbom.cdx.json; nothing was attached." >> "$GITHUB_STEP_SUMMARY"
