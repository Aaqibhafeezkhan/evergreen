spec:
  inputs:
    stage:
      description: Pipeline stage the job runs in.
      default: test
    path:
      description: Repository root or subdirectory to scan. Defaults to the checked-out repository.
      default: .
    baseline:
      description: Optional baseline path relative to the project directory. Leave empty to report every finding.
      default: ""
    baseline_warn_days:
      description: Warn when a suppression in the baseline expires within this many days (0 to 365).
      default: "14"
    on_expired:
      description: >-
        What a baseline suppression does after its expires date: resurface (its finding is reported again) or
        fail (also fail the job).
      default: resurface
      options: [resurface, fail]
    min_support_days:
      description: >-
        Warn (medium severity) on lines whose support ends within this many days. Leave empty to report only
        what the data already marks.
      default: ""
    fail_on_severity:
      description: Lowest severity that fails the job (none, info, low, medium, high, or critical).
      default: high
      options: [none, info, low, medium, high, critical]
    report_name:
      description: File name of the JSON report that is kept as a job artifact.
      default: evergreen-report.json
    code_quality_report_name:
      description: File name of the GitLab Code Quality report that shows findings in merge requests.
      default: gl-code-quality-report.json
    version:
      description: Version of the evergreen-deprecation npm package to run.
      default: 0.6.1
    image:
      description: Node.js 22 or newer image the job runs in.
      default: node:24-trixie-slim
---
evergreen:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  variables:
    GIT_DEPTH: "1"
    EVERGREEN_PATH: $[[ inputs.path ]]
    EVERGREEN_BASELINE: $[[ inputs.baseline ]]
    EVERGREEN_BASELINE_WARN_DAYS: $[[ inputs.baseline_warn_days ]]
    EVERGREEN_ON_EXPIRED: $[[ inputs.on_expired ]]
    EVERGREEN_MIN_SUPPORT_DAYS: $[[ inputs.min_support_days ]]
    EVERGREEN_FAIL_ON_SEVERITY: $[[ inputs.fail_on_severity ]]
    EVERGREEN_REPORT: $[[ inputs.report_name ]]
    EVERGREEN_CODE_QUALITY_REPORT: $[[ inputs.code_quality_report_name ]]
  script:
    - |
      set -u
      set -- "$EVERGREEN_PATH"
      if [ -n "$EVERGREEN_BASELINE" ]; then
        set -- "$@" --baseline "$EVERGREEN_PATH/$EVERGREEN_BASELINE" --baseline-warn-days "$EVERGREEN_BASELINE_WARN_DAYS" --on-expired "$EVERGREEN_ON_EXPIRED"
      fi
      if [ -n "$EVERGREEN_MIN_SUPPORT_DAYS" ]; then
        set -- "$@" --min-support-days "$EVERGREEN_MIN_SUPPORT_DAYS"
      fi
      evergreen() { npx --yes "evergreen-deprecation@$[[ inputs.version ]]" "$@"; }
      # The report is written before the gate is applied, so it is kept even when the job fails.
      set +e
      evergreen scan "$@" --json --fail-on "$EVERGREEN_FAIL_ON_SEVERITY" > "$EVERGREEN_REPORT"
      status=$?
      set -e
      evergreen scan "$@" --format codequality > "$EVERGREEN_CODE_QUALITY_REPORT" || true
      evergreen scan "$@" || true
      exit "$status"
  artifacts:
    when: always
    paths:
      - $[[ inputs.report_name ]]
    reports:
      codequality: $[[ inputs.code_quality_report_name ]]
    expire_in: 14 days
