plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(20)
    }
    sourceCompatibility = JavaVersion.VERSION_19
    targetCompatibility = '18'
}

dependencies {
    implementation 'com.google.guava:guava:33.0.0-jre'
}
