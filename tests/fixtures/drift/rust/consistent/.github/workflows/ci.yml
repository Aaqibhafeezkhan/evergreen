name: ci
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1.79.0
    services:
      cache:
        image: redis:7
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.79.0
      - uses: dtolnay/rust-toolchain@1.79.0
        with:
          toolchain: 1.79.0
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.79.0
          override: true
