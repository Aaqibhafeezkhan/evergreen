name: Release notes

# Drafts the changelog entries for a release from conventional commits. It only reads the repository and
# publishes nothing: a maintainer copies the notes into CHANGELOG.md (or runs the tool with --write) and
# follows docs/RELEASING.md for the rest.
on:
  workflow_dispatch:
    inputs:
      from:
        description: Tag or commit to start from (default is the latest tag)
        required: false
      release_tag:
        description: Dry run of the major Action tag for this release tag (for example v1.4.2). Pushes nothing.
        required: false
        default: ""
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]

permissions:
  contents: read

jobs:
  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Draft the release notes
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then
            node dist/tools/changelog.js --from "$FROM" > release-notes.md
          else
            node dist/tools/changelog.js > release-notes.md
          fi
          { echo "## Draft release notes"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ github.run_id }}
          path: release-notes.md

  major-tag:
    # The publish workflow includes the package smoke test, so a successful completion means every
    # release gate has passed. Pre-releases and pre-1.0 releases intentionally leave major tags alone.
    # A manual run with `release_tag` is a dry run: it makes every decision and pushes nothing.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: action-major-tag
      cancel-in-progress: false
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || format('refs/tags/{0}', inputs.release_tag) }}
          fetch-depth: 0
      - name: Select the stable release tag
        id: release
        shell: bash
        run: |
          # The decision lives in .github/scripts/major-tag.mjs, which has unit tests (tests/major-tag.test.ts).
          release_sha="$(git rev-parse HEAD)"
          tags="$(git tag --points-at "$release_sha")"
          version="$(node -p "require('./package.json').version")"
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          node .github/scripts/major-tag.mjs select --tags "$tags" --package-version "$version" >> "$GITHUB_OUTPUT"
      - name: Check the major tag only moves forward
        id: direction
        if: steps.release.outputs.move == 'true'
        env:
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
        shell: bash
        run: |
          old_target="$(git ls-remote --refs origin "refs/tags/$MAJOR_TAG" | cut -f1)"
          current_tags=""
          if [ -n "$old_target" ]; then current_tags="$(git tag --points-at "$old_target")"; fi
          echo "old-target=$old_target" >> "$GITHUB_OUTPUT"
          node .github/scripts/major-tag.mjs direction --major "$MAJOR_TAG" --release "$RELEASE_TAG" --current-tags "$current_tags" >> "$GITHUB_OUTPUT"
      - name: Say what would happen (dry run)
        if: env.DRY_RUN == 'true'
        env:
          MOVE: ${{ steps.release.outputs.move }}
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          OLD_TARGET: ${{ steps.direction.outputs.old-target }}
        shell: bash
        run: |
          if [ "$MOVE" = "true" ]; then
            echo "Dry run: $MAJOR_TAG would move from ${OLD_TARGET:-nothing (new tag)} to $RELEASE_TAG ($RELEASE_SHA). Nothing was pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: no major tag would move. Nothing was pushed." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Move the major Action tag
        if: env.DRY_RUN != 'true' && steps.release.outputs.move == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release-sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release-tag }}
          MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
          OLD_TARGET: ${{ steps.direction.outputs.old-target }}
        shell: bash
        run: |
          git tag --force "$MAJOR_TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$MAJOR_TAG" --force-with-lease="refs/tags/$MAJOR_TAG:$OLD_TARGET"
          echo "$MAJOR_TAG now points to $RELEASE_TAG ($RELEASE_SHA)." >> "$GITHUB_STEP_SUMMARY"
