[package]
name = "positive"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
failure = "0.1.8"
tempdir = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
console = { package = "atty", version = "0.2.14" }

[dev-dependencies]
ansi_term = "0.12"

[build-dependencies]
cc = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
