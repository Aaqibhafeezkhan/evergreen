name: Rules (changed)

# Pull-request CI for registry rules. It lints the changed registry files and fixture-tests only the rules the
# diff touches, so a rule change is verified by the scan engine before merge instead of after a release.
# Offline: it reads the checkout only. There is no network step, no secret, and no write scope.

on:
  pull_request:
    paths:
      - "registry/**"
      - "tests/fixtures/**"
      - "src/rule-lint.ts"
      - "src/rule-test.ts"
      - "tools/changed-rules.ts"
      - ".github/workflows/rules.yml"

permissions:
  contents: read

concurrency:
  group: rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: rules (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changed rules come from the diff against the base branch, which needs its history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Lint and test the changed rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          node dist/tools/changed-rules.js --base "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY"
