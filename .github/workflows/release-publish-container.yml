# Release stage: build, smoke, publish, and sign the container image.
# A dry run builds and smokes the image, then pushes nothing.
name: Release publish container

on:
  workflow_call:
    inputs:
      dry_run:
        description: Build and smoke only; do not push to ghcr.io
        type: boolean
        required: true
      release_sha:
        description: Commit to check out for a post-publish run; empty uses the default branch
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: container-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Default branch first: ref: workflow_run.head_sha is a Dangerous-Workflow untrusted checkout.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release commit
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: git checkout --detach "$RELEASE_SHA"
      - name: Select release
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$RELEASE_SHA" ]; then
            git tag --points-at HEAD | grep -Fx "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${{ github.repository }}:$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then
            echo "tags=ghcr.io/${{ github.repository }}:$version,ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and smoke test
        run: |
          docker build -t evergreen-smoke .
          mkdir -p "$RUNNER_TEMP/evergreen-smoke"
          cp tests/fixtures/smoke/package.json.fixture "$RUNNER_TEMP/evergreen-smoke/package.json"
          node .github/scripts/smoke.mjs /workspace -- docker run --rm --network none --read-only -v "$RUNNER_TEMP/evergreen-smoke:/workspace:ro" evergreen-smoke
      - name: Publish image
        id: image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.release.outputs.tags }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.dry_run }}
      - name: Sign image digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@$DIGEST"
      - name: Record dry-run stage
        if: inputs.dry_run
        run: echo "Publish stage (container) completed in dry run; image was not pushed." >> "$GITHUB_STEP_SUMMARY"

  # SLSA Build L3 provenance for the image digest, generated in an isolated builder job and pushed
  # to the registry as an attestation. The generator must be referenced by a vX.Y.Z tag.
  provenance:
    needs: container
    if: ${{ !inputs.dry_run }}
    permissions:
      actions: read
      id-token: write
      packages: write
    # zizmor: ignore[unpinned-uses] -- the generator identifies itself by this vX.Y.Z tag, not by a commit SHA
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.container.outputs.image }}
      digest: ${{ needs.container.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The release fails if the provenance is missing or does not match the published digest.
  verify:
    needs: [container, provenance]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/.github/actions/slsa-verifier
      - name: Verify the image provenance
        env:
          IMAGE: ${{ needs.container.outputs.image }}
          DIGEST: ${{ needs.container.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          slsa-verifier verify-image "$IMAGE@$DIGEST" \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "$TAG" \
            --builder-id "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0"
