name: Onboarding end-to-end

# Proves the whole onboarding loop against a disposable sandbox repository: the app receives a
# signed installation delivery, opens the `evergreen/onboarding` pull request, and the pull
# request's first "Evergreen" run finishes green. Manual only, because it writes to another
# repository and needs a real App installation.
#
# One-time setup:
# 1. Install the Evergreen App on the sandbox repository, or on an organization that includes it.
# 2. Add repository secrets:
#    - `ONBOARDING_APP_ID` and `ONBOARDING_APP_PRIVATE_KEY`: the App credentials.
#    - `ONBOARDING_WEBHOOK_SECRET`: the App's webhook secret (only used to sign the replay).
#    - `ONBOARDING_SANDBOX_TOKEN`: a token for the sandbox repository with Actions read,
#      Contents write, and Pull requests write. The App token cannot read workflow runs, so the
#      workflow uses this token to watch the first run and to clean up.
# 3. Dispatch with the sandbox's `owner/name`. The job closes the pull request and deletes the
#    branch on the way out unless you set `keep-sandbox`.

on:
  workflow_dispatch:
    inputs:
      sandbox-repository:
        description: Disposable repository to onboard, as owner/name.
        required: true
        type: string
      installation-id:
        description: App installation id. Leave empty to resolve it from the sandbox repository.
        required: false
        default: ""
        type: string
      wait-timeout-minutes:
        description: Minutes to wait for the pull request's first Evergreen run.
        required: false
        default: "15"
        type: string
      keep-sandbox:
        description: Keep the pull request and branch for inspection instead of cleaning up.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: onboarding-e2e-${{ inputs.sandbox-repository }}
  cancel-in-progress: false

jobs:
  onboarding:
    name: onboarding e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SANDBOX_REPOSITORY: ${{ inputs.sandbox-repository }}
      INSTALLATION_ID: ${{ inputs.installation-id }}
      WAIT_TIMEOUT_MINUTES: ${{ inputs.wait-timeout-minutes }}
      ONBOARDING_APP_ID: ${{ secrets.ONBOARDING_APP_ID }}
      ONBOARDING_APP_PRIVATE_KEY: ${{ secrets.ONBOARDING_APP_PRIVATE_KEY }}
      ONBOARDING_WEBHOOK_SECRET: ${{ secrets.ONBOARDING_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ secrets.ONBOARDING_SANDBOX_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the sandbox and the credentials
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$SANDBOX_REPOSITORY"
          if [[ ! "$sandbox" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::sandbox-repository must be owner/name (got '$sandbox')."
            exit 1
          fi
          if [[ "${sandbox,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::Refusing to onboard this repository; dispatch with a disposable sandbox repository."
            exit 1
          fi
          if [[ -n "$INSTALLATION_ID" && ! "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::installation-id must be a positive integer (got '$INSTALLATION_ID')."
            exit 1
          fi
          if [[ ! "$WAIT_TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::wait-timeout-minutes must be a positive integer (got '$WAIT_TIMEOUT_MINUTES')."
            exit 1
          fi
          for name in ONBOARDING_APP_ID ONBOARDING_APP_PRIVATE_KEY ONBOARDING_WEBHOOK_SECRET GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret mapped to $name."
              exit 1
            fi
          done
          if [[ "$(gh api "/repos/$sandbox" --jq '.permissions.push // false')" != "true" ]]; then
            echo "::error::ONBOARDING_SANDBOX_TOKEN cannot write to $sandbox."
            exit 1
          fi
          if ! gh api "/repos/$sandbox/actions/runs?per_page=1" > /dev/null; then
            echo "::error::ONBOARDING_SANDBOX_TOKEN cannot read workflow runs on $sandbox (needs Actions: read)."
            exit 1
          fi
          echo "Preflight passed for $sandbox."

      - uses: $/.github/actions/setup
        with:
          cache: npm

      - name: Build the app from the source under test
        run: npm run build --silent

      - name: Resolve the app installation
        id: installation
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          import { createAppJwt } from "./integrations/github-app/app-jwt.mjs";

          const [owner, repo] = process.env.SANDBOX_REPOSITORY.split("/");
          const privateKeyPem = process.env.ONBOARDING_APP_PRIVATE_KEY.replaceAll("\\n", "\n");
          const jwt = createAppJwt({ appId: process.env.ONBOARDING_APP_ID, privateKeyPem });
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/installation`, {
            headers: {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${jwt}`,
              "x-github-api-version": "2022-11-28",
            },
          });
          if (response.status === 404) {
            console.error(
              `::error::The app is not installed on ${owner}/${repo}. Install it on the sandbox repository and retry.`,
            );
            process.exit(1);
          }
          if (!response.ok) {
            console.error(`::error::Could not read the installation (${response.status}): ${await response.text()}`);
            process.exit(1);
          }
          const installation = await response.json();
          const requested = (process.env.INSTALLATION_ID ?? "").trim();
          if (requested !== "" && requested !== String(installation.id)) {
            console.error(
              `::error::installation-id ${requested} does not belong to ${owner}/${repo} (resolved ${installation.id}).`,
            );
            process.exit(1);
          }
          console.log(`App installation ${installation.id} covers ${owner}/${repo}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `installation-id=${installation.id}\n`);
          NODE

      - name: Reset the sandbox to a clean starting point
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$SANDBOX_REPOSITORY"
          owner="${sandbox%%/*}"
          head="${owner}:evergreen/onboarding"
          pulls="$(gh api "/repos/$sandbox/pulls?state=open&head=$head" --jq '.[].number')"
          while IFS= read -r pr; do
            if [[ -z "$pr" ]]; then
              continue
            fi
            gh api --method PATCH "/repos/$sandbox/pulls/$pr" -f state=closed > /dev/null
            echo "Closed stale pull request #$pr."
          done <<< "$pulls"
          if gh api "/repos/$sandbox/git/ref/heads/evergreen/onboarding" > /dev/null 2>&1; then
            gh api --method DELETE "/repos/$sandbox/git/refs/heads/evergreen/onboarding" > /dev/null
            echo "Deleted the stale evergreen/onboarding branch."
          fi

      - name: Replay the installation delivery and open the pull request
        id: onboard
        shell: bash
        timeout-minutes: 10
        env:
          PORT: "39147"
          INSTALLATION_ID: ${{ steps.installation.outputs.installation-id }}
          GITHUB_APP_ID: ${{ secrets.ONBOARDING_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.ONBOARDING_APP_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.ONBOARDING_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/onboarding-app.log"
          node integrations/github-app/server.mjs > "$log" 2>&1 &
          app_pid=$!
          stop_app() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap stop_app EXIT
          ready="false"
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:39147/healthz; then
              ready="true"
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::The onboarding app did not become healthy."
            cat "$log" || true
            exit 1
          fi
          set +e
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          import { signBody } from "./integrations/github-app/verify-signature.mjs";

          const [owner, repo] = process.env.SANDBOX_REPOSITORY.split("/");
          const rawBody = JSON.stringify({
            action: "created",
            installation: { id: Number(process.env.INSTALLATION_ID), account: { login: owner } },
            repositories: [{ id: 0, name: repo, full_name: `${owner}/${repo}`, private: true }],
            sender: { login: owner },
          });
          const response = await fetch("http://127.0.0.1:39147/webhook", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-github-event": "installation",
              "x-hub-signature-256": signBody(process.env.ONBOARDING_WEBHOOK_SECRET, rawBody),
            },
            body: rawBody,
          });
          const text = await response.text();
          if (!response.ok) {
            console.error(`::error::The app rejected the installation delivery (${response.status}): ${text}`);
            process.exit(1);
          }
          const result = JSON.parse(text);
          const first = result.results?.[0];
          if (first?.status !== "opened") {
            console.error(`::error::Expected an opened pull request, got ${JSON.stringify(first)}.`);
            process.exit(1);
          }
          console.log(`Opened ${first.pullRequestUrl}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `pr-number=${first.number}\n`);
          NODE
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::group::Onboarding app log"
            cat "$log" || true
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Wait for the onboarding pull request
        id: pull-request
        shell: bash
        env:
          PR_NUMBER: ${{ steps.onboard.outputs.pr-number }}
        run: |
          set -euo pipefail
          pr="$PR_NUMBER"
          deadline=$((SECONDS + WAIT_TIMEOUT_MINUTES * 60))
          head_sha=""
          while :; do
            if gh api "/repos/$SANDBOX_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pull.json" 2>/dev/null; then
              head_sha="$(jq -r '.head.sha // empty' "$RUNNER_TEMP/pull.json")"
              if [[ -n "$head_sha" ]]; then
                break
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out waiting for pull request #$pr."
              exit 1
            fi
            sleep 5
          done
          gh api "/repos/$SANDBOX_REPOSITORY/pulls/$pr/files" > "$RUNNER_TEMP/pull-files.json"
          for path in .github/workflows/evergreen.yml .evergreen.json; do
            if ! jq -e --arg path "$path" 'any(.[]; .filename == $path)' "$RUNNER_TEMP/pull-files.json" > /dev/null; then
              echo "::error::The onboarding pull request does not add $path."
              exit 1
            fi
          done
          if ! grep -q "How to remove it" "$RUNNER_TEMP/pull.json"; then
            echo "::error::The onboarding pull request does not explain how to remove Evergreen."
            exit 1
          fi
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Pull request #$pr adds the pinned workflow and config and explains removal."

      - name: Wait for the first Evergreen run to pass
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + WAIT_TIMEOUT_MINUTES * 60))
          while :; do
            if runs="$(gh api "/repos/$SANDBOX_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100" 2>/dev/null)"; then
              row="$(jq -r '
                [.workflow_runs[] | select(.path == ".github/workflows/evergreen.yml")]
                | sort_by(.created_at)
                | last
                | select(. != null)
                | [.id, .status, .conclusion, .html_url]
                | @tsv
              ' <<< "$runs")"
              if [[ -n "$row" ]]; then
                IFS=$'\t' read -r run_id run_status run_conclusion run_url <<< "$row"
                if [[ "$run_status" == "completed" ]]; then
                  if [[ "$run_conclusion" != "success" ]]; then
                    echo "::error::The first Evergreen run concluded '$run_conclusion': $run_url"
                    gh run view "$run_id" --repo "$SANDBOX_REPOSITORY" --log-failed || true
                    exit 1
                  fi
                  echo "The first Evergreen run passed: $run_url"
                  exit 0
                fi
                echo "Evergreen run $run_id is $run_status; waiting..."
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out after ${WAIT_TIMEOUT_MINUTES}m waiting for the first Evergreen run."
              exit 1
            fi
            sleep 10
          done

      - name: Clean up the sandbox
        if: ${{ always() && steps.preflight.outcome == 'success' && !inputs.keep-sandbox }}
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$SANDBOX_REPOSITORY"
          owner="${sandbox%%/*}"
          head="${owner}:evergreen/onboarding"
          pulls="$(gh api "/repos/$sandbox/pulls?state=open&head=$head" --jq '.[].number')"
          while IFS= read -r pr; do
            if [[ -z "$pr" ]]; then
              continue
            fi
            gh api --method PATCH "/repos/$sandbox/pulls/$pr" -f state=closed > /dev/null
            echo "Closed pull request #$pr."
          done <<< "$pulls"
          if gh api "/repos/$sandbox/git/ref/heads/evergreen/onboarding" > /dev/null 2>&1; then
            gh api --method DELETE "/repos/$sandbox/git/refs/heads/evergreen/onboarding" > /dev/null
            echo "Deleted the evergreen/onboarding branch."
          fi
