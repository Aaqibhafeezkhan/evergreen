<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 965 482" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen dark marketplace feature background</title>
  <desc id="desc">A text-free dark background with measured lifecycle rings and version notches for Marketplace overlays.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F3ECE8" stroke-opacity=".035"/></pattern>
    <mask id="notch-top"><rect width="965" height="482" fill="white"/><rect x="755" y="42" width="24" height="42" fill="black"/></mask>
    <mask id="notch-right"><rect width="965" height="482" fill="white"/><rect x="904" y="229" width="46" height="24" fill="black"/></mask>
    <mask id="notch-bottom"><rect width="965" height="482" fill="white"/><rect x="755" y="365" width="24" height="46" fill="black"/></mask>
  </defs>
  <rect width="965" height="482" fill="#2B0B15"/>
  <rect width="965" height="482" fill="url(#grid)"/>
  <rect x="34" y="34" width="897" height="414" rx="22" fill="#0A0A0C" fill-opacity=".3" stroke="#F3ECE8" stroke-opacity=".08"/>
  <g fill="none" stroke-width="24">
    <circle cx="767" cy="241" r="174" stroke="#571729" mask="url(#notch-top)"/>
    <circle cx="767" cy="241" r="137" stroke="#8F3048" mask="url(#notch-right)"/>
    <circle cx="767" cy="241" r="100" stroke="#B96779" mask="url(#notch-bottom)"/>
  </g>
  <rect x="844" y="319" width="18" height="18" rx="3" fill="#F3ECE8"/>
  <path d="M80 118H436M80 364H356" stroke="#F3ECE8" stroke-opacity=".12"/>
  <circle cx="80" cy="118" r="4" fill="#B96779"/>
  <circle cx="80" cy="364" r="4" fill="#365C4C"/>
</svg>

