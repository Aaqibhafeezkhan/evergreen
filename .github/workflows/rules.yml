name: Rules (changed)

# Pull-request CI for rule fixtures. The rules live in @velella/ebb, which lints them; this workflow checks that the
# detectors still report each rule's match fixture and not its clean fixture. It runs the rules whose fixtures the
# diff touches, and every rule with fixtures when the diff moves @velella/ebb to another version.
# Offline: it reads the checkout and the installed packages only. There is no secret and no write scope.

on:
  push:
    branches: [main]
    paths:
      - "package-lock.json"
      - "tests/fixtures/**"
      - "src/rule-test.ts"
      - "tools/changed-rules.ts"
      - ".github/workflows/rules.yml"
  pull_request:
    paths:
      - "package-lock.json"
      - "tests/fixtures/**"
      - "src/rule-test.ts"
      - "tools/changed-rules.ts"
      - ".github/workflows/rules.yml"

permissions:
  contents: read

concurrency:
  group: rules-${{ github.sha }}
  cancel-in-progress: false

jobs:
  rules:
    name: rules (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changed rules come from the diff against the base branch, which needs its history.
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: npm
      - run: npm run build --silent
      - name: Test the affected rule fixtures
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has no previous commit (all zeros), so every rule with fixtures runs.
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            node dist/tools/changed-rules.js --all --summary "$GITHUB_STEP_SUMMARY"
          else
            git fetch --no-tags origin "$BASE_SHA"
            node dist/tools/changed-rules.js --base "$BASE_SHA" --summary "$GITHUB_STEP_SUMMARY"
          fi
