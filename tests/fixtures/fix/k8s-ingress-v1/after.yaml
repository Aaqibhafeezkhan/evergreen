apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web # the edge
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  defaultBackend:
    service:
      name: default-svc
      port:
        number: 8080
  tls:
    - secretName: web-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: shop
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: shop-api # the api service
                port:
                  number: 9000 # the api port
    - http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: catchall
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  ports:
    - port: 80
      targetPort: http
