# apiVersion: extensions/v1beta1
# kind: Ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: examples
  ownerReferences:
    - apiVersion: apps/v1beta1
      kind: Deployment
      name: old
      uid: 0000
data:
  legacy.yaml: |
    apiVersion: extensions/v1beta1
    kind: Ingress
---
# apiVersion without kind
apiVersion: extensions/v1beta1
metadata:
  name: no-kind
---
# kind without apiVersion
kind: Ingress
metadata:
  name: no-api-version
---
# a YAML alias is not a literal value and is rejected
base: &old extensions/v1beta1
apiVersion: *old
kind: Ingress
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ingresses.example.test
spec:
  group: example.test
  names:
    kind: Ingress
    plural: ingresses
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
---
apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: inside-a-list
