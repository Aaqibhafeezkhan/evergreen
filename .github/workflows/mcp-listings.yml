name: MCP listings

# Fetches every tracked MCP directory listing and compares the shown version to server.json.
# Needs the network, so it is deliberately not part of pull-request CI. Opens one issue when a
# listing is stale. Scans never use this workflow or the network.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Check MCP directory listings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/tools/check-mcp-listings.js --out mcp-listings-report.json --summary "$GITHUB_STEP_SUMMARY" --open-issue
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-listings-report
          path: mcp-listings-report.json
          if-no-files-found: warn
