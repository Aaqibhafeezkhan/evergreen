name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the reference pages against the registry
        if: runner.os == 'Linux' && matrix.node == 22
        run: node dist/tools/build-reference-pages.js --check
      - name: Enforce coverage thresholds
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm run test:coverage | tee coverage.txt
      - name: Generate the lifecycle calendar
        if: runner.os == 'Linux' && matrix.node == 22
        run: node dist/tools/eol-calendar.js --out-dir "$RUNNER_TEMP/eol-calendar"
      - name: Upload the lifecycle calendar
        if: runner.os == 'Linux' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eol-calendar
          path: ${{ runner.temp }}/eol-calendar
          retention-days: 14
      - name: Dogfood Evergreen action
        if: runner.os == 'Linux' && matrix.node == 22
        uses: ./
        with:
          fail-on-severity: high
          report-name: evergreen-report-${{ github.sha }}
          upload-sarif: ${{ github.event_name == 'push' }}

  self-scan:
    name: self-scan (fail on new findings)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Scan this repository with the code under test
        run: |
          node dist/src/cli.js scan . --baseline .evergreen-baseline.json --json > "$RUNNER_TEMP/self-scan.json"
          node -e '
            const result = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const f of result.findings) console.error(`::error::${f.ruleId} ${f.id}: new finding not covered by .evergreen-baseline.json`);
            process.exit(result.findings.length ? 1 : 0);
          ' "$RUNNER_TEMP/self-scan.json"

  coverage-badge:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Measure coverage
        run: npm run test:coverage | tee coverage.txt
      - name: Publish the badge to the badges branch
        run: |
          node dist/tools/coverage-badge.js < coverage.txt > "$RUNNER_TEMP/coverage.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth 1 origin badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet || { git commit -qm "chore: update the coverage badge"; git push origin badges; }
