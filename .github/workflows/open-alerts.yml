name: Open alerts

# Fails when a code-scanning or Dependabot alert is open on main that tools/open-alerts-baseline.json
# does not accept (issue #2070). The baseline holds the alerts open when this gate was added; it may
# only shrink. The failed run links each new alert. It runs after every push to main, daily, and on
# demand, because Dependabot alerts appear on their own schedule, not on a push.
#
# What this job cannot see:
# - Alerts on pull request branches and other branches: the requests ask for refs/heads/main only.
# - Alerts that a scan has not produced yet: a finding exists only after CodeQL or Scorecard has run.
# - Dismissed or fixed alerts: the requests ask for state=open only, so they never count.
# - Secret scanning and private vulnerability reports: this gate reads neither.
# - Alerts from a fork's own code scanning or Dependabot settings: they belong to the fork.
# - Alerts in a repository other than this one: the tokens are scoped to this repository.
# - Dependabot alerts when the ALERTS_READ_TOKEN secret is missing, expired or revoked: the read
#   fails and the run goes red. Renew the token before it expires.
#
# It is not a pull request gate. Fork pull requests get a read-only token without security-events
# access, and a pull request cannot make a new alert appear on main before it merges.
# It is deliberately not a required status check: a red run opens follow-up work, as in docs/CI.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *" # Daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-alerts
  cancel-in-progress: false

jobs:
  gate:
    name: Fail on new open alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Checkout the repository, which holds the gate script and its baseline.
      contents: read
      # Read open code-scanning alerts and Dependabot alerts. Nothing is written.
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read open code-scanning alerts on main
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/code-scanning.json"

      - name: Read open Dependabot alerts
        # The workflow token cannot read Dependabot alerts (HTTP 403), so this step uses a
        # fine-grained token limited to this repository with "Dependabot alerts: Read-only".
        env:
          GH_TOKEN: ${{ secrets.ALERTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPOSITORY/dependabot/alerts?state=open&per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/dependabot.json"

      - name: Compare with the baseline
        run: |
          set -euo pipefail
          node tools/open-alerts-gate.mjs \
            --code-scanning "$RUNNER_TEMP/code-scanning.json" \
            --dependabot "$RUNNER_TEMP/dependabot.json" \
            --baseline tools/open-alerts-baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
