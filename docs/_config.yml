title: Evergreen
url: https://arminazimi.github.io
baseurl: /evergreen
description: Local-first deprecation intelligence for software repositories.
remote_theme: arminazimi/slipway@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  # Meta-refresh pages for inventory URLs that jekyll-readme-index no longer
  # publishes as …/README.html (redirect_to on dashboard/README.md and docs/redirects/).
  - jekyll-redirect-from
include:
  - .well-known
defaults:
  - scope:
      path: ""
    values:
      layout: doc
      image: /assets/og/default.svg
slipway:
  source_dir: docs
  logo:
    light: /assets/brand/evergreen-mark-adaptive.svg
    dark: /assets/brand/evergreen-mark-adaptive.svg
    favicon_svg: /assets/brand/evergreen-mark-adaptive.svg
  tokens:
    font_body: 'Inter, ui-sans-serif, -apple-system, "Segoe UI", sans-serif'
