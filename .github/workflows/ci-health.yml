name: CI health

# Measures how long ci.yml takes on completed runs, so the five-minute target stays visible. Writes
# metrics/ci/<date>.json and the step summary, and opens or updates one `area: devops` issue when
# the pull request p50 is over five minutes. Weekly it also lists flaky tests seen in ci.yml logs.
# Nightly it runs tests listed in tests/quarantine.json. It needs the network, so it is deliberately
# not part of pull-request CI.

on:
  schedule:
    - cron: "47 6 * * 1" # Mondays, 06:47 UTC — duration + weekly flaky list
    - cron: "47 5 * * *" # Nightly, 05:47 UTC — quarantined tests
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options:
          - measure
          - quarantine
          - both
        default: both

permissions:
  contents: read

concurrency:
  group: ci-health-${{ github.event.schedule || github.event.inputs.job || 'dispatch' }}
  cancel-in-progress: false

jobs:
  measure:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'measure' || github.event.inputs.job == 'both')
      || github.event.schedule == '47 6 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Measure CI duration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/tools/ci-duration.js --summary "$GITHUB_STEP_SUMMARY" --open-issue
      - name: List flaky tests from the past week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/run-tests.mjs --list-weekly-flaky
      - name: Upload the metrics file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-duration
          path: metrics/ci
          if-no-files-found: warn

  quarantine:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'quarantine' || github.event.inputs.job == 'both')
      || github.event.schedule == '47 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - name: Run quarantined tests
        # Quarantined files are skipped on pull requests; this nightly job is where they still run.
        env:
          EVERGREEN_RETRY_FLAKY: "0"
        run: node tools/run-tests.mjs --quarantine-only
