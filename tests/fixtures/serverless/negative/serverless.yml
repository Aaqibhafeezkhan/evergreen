# runtime: nodejs14.x
service: orders
provider:
  name: aws
  runtime: ${opt:runtime, 'nodejs14.x'}
  memorySize: 128
custom:
  runtime: nodejs14.x
functions:
  api:
    handler: handler.api
    runtime: ${self:custom.runtime}
    description: "runtime: python3.8"
  image:
    image: public.ecr.aws/lambda/nodejs:14
  floating:
    handler: handler.floating
    runtime: latest
